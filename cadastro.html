<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/cadastro.css">
    <title>Cadastro - Smart Control</title>
</head>
<body>
    <header class="cabecalho">
        <img class="logo" src="assets/images/lampada.png" alt="Logo Smart Control">
        <h1>Criar conta</h1>
        <a class="menu" href="#">
            <img src="assets/images/hamburguer.png" alt="Menu">
        </a>
    </header>

    <main>
        <div class="card-login">
            <h2>Cadastro</h2>
            <form action="index.html" method="get">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="Nome completo" placeholder="Enter" required><br><br>

                <label for="email">Email</label>
                <input type="email" id="email" name="Email" placeholder="Enter" required><br><br>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="Senha" minlength="8" placeholder="Enter" required><br><br>

                <label for="nivel-acesso">Nível de acesso</label>
                <select id="nivel-acesso" name="Nível" required>
                    <option value="" hidden>Selecione uma opção</option>
                    <option value="administrador">administrador</option>
                    <option value="gerente">gerente</option>
                </select><br><br>

                <label class="termos" for="termos">
                    <input type="checkbox" id="termos" required>
                    Aceito os termos de uso
                </label>

                <input class="botao-login" type="submit" value="Cadastrar">
            </form>

            <a class="criar-conta" href="index.html">Voltar ao login</a>
        </div>
    </main>
</body>
</html>
