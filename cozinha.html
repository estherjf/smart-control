<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/comodo.css">
    <title>Cozinha - Smart Control</title>
</head>
<body>
    <header class="cabecalho">
        <div class="esquerda">
            <img class="logo" src="assets/images/lampada.png" alt="Logo Smart Control">
            <h1 class="titulo">Dashboard</h1>
        </div>
        <div class="esquerda">
            <span class="nome-comodo">Cozinha</span>
            <details class="menu">
                <summary>
                    <img class="icone-menu" src="assets/images/hamburguer.png" alt="Menu">
                </summary>
                <div class="menu-caixa">
                    <nav>
                        <ul><a href="dashboard.html#comodos">Escolher Cômodo</a></ul>
                        <ul><a href="gerenciar-dispositivos.html">Gerenciar Dispositivos</a></ul>
                        <ul><a href="index.html">Sair</a></ul>
                    </nav>
                </div>
            </details>
        </div>
    </header>

    <main class="conteudo">
        <section class="coluna-esquerda">
            <h2 class="subtitulo">Aparelhos do cômodo</h2>
            <div class="lista">
                <div class="aparelho selecionado">Cafeteira</div>
                <div class="aparelho">Panela elétrica</div>
                <div class="aparelho">AirFryer</div>
            </div>
        </section>

        <section class="coluna-direita">
            <h2 class="subtitulo">Dados de uso - Cafeteira</h2>
            <div class="graficos">
                <div class="caixa-grafico">
                    <p class="titulo-grafico">Consumo de energia</p>
                    <div class="pizza" style="background: conic-gradient(#3ddc97 0% 35%, #f5e642 35% 70%, #48c5dc 70% 100%);"></div>
                    <div class="legenda">
                        <span><i class="bolinha1"></i>Aparelho 1</span>
                        <span><i class="bolinha2"></i>Aparelho 2</span>
                        <span><i class="bolinha3"></i>Aparelho 3</span>
                    </div>
                </div>

                <div class="caixa-grafico">
                    <p class="titulo-grafico">Horário de pico de uso</p>
                    <div class="barras">
                        <div class="coluna1"></div>
                        <div class="coluna2"></div>
                        <div class="coluna3"></div>
                    </div>
                    <div class="rotulos"><span>18h</span><span>20h</span><span>22h</span></div>
                </div>

                <div class="caixa-grafico">
                    <p class="titulo-grafico">Tempo de uso</p>
                    <div class="barras">
                        <div class="coluna4"></div>
                        <div class="coluna5"></div>
                        <div class="coluna6"></div>
                    </div>
                    <div class="rotulos"><span>Seg</span><span>Ter</span><span>Qua</span></div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
