<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/dispositivos.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <title>Gerenciar Dispositivos - Smart Control</title>
</head>
<body>
    <header class="cabecalho">
        <div class="esquerda">
            <img class="logo" src="assets/images/lampada.png" alt="Logo Smart Control">
            <h1 class="titulo">Gerenciar Dispositivos</h1>
        </div>
        <details class="menu">
            <summary>
                <img class="icone-menu" src="assets/images/menu.png" alt="Menu">
            </summary>
            <div class="menu-caixa">
                <nav>
                    <ul><a href="dashboard.html#comodos">Escolher Cômodo</a></ul>
                    <ul><a href="gerenciar-dispositivos.html">Gerenciar Dispositivos</a></ul>
                    <ul><a href="index.html">Sair</a></ul>
                </nav>
            </div>
        </details>
    </header>

    <main class="conteudo">
        <section class="caixa">
            <p class="pergunta">Cadastrar / editar dispositivo</p>
            <form id="form-dispositivo" class="form-dispositivo">
                <div class="campo-grupo">
                    <label for="nome-dispositivo">Nome do dispositivo</label>
                    <input type="text" id="nome-dispositivo" placeholder="Ex: Televisão, Lâmpada, Ar-condicionado" required>
                </div>

                <div class="campo-grupo">
                    <label for="comodo-dispositivo">Cômodo</label>
                    <div class="select-wrap">
                        <select id="comodo-dispositivo" required>
                            <option value="" disabled selected>Selecione o cômodo</option>
                            <option value="quarto">Quarto Principal</option>
                            <option value="sala">Sala</option>
                            <option value="cozinha">Cozinha</option>
                            <option value="outros-comodos">Outros Cômodos</option>
                        </select>
                    </div>
                </div>

                <button class="botao" type="submit" id="botao-salvar">Cadastrar dispositivo</button>
            </form>
        </section>

        <section class="caixa-listagem">
            <h2>Todos os dispositivos</h2>
            <div id="lista-todos" class="lista-todos"></div>
        </section>
    </main>

    <script src="assets/js/dispositivos.js"></script>
    <script src="assets/js/gerenciar.js"></script>
    <script src="assets/js/main.js"></script>

</body>
</html>
