<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Control</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body>
    <header class="cabecalho">
        <img class="logo" src="assets/images/menu.png" alt="Logo Smart-control">
        <h1>Faça seu login</h1>
        <a class="menu" href="#">
            <img src="assets/images/menu.png" alt="Menu">
        </a>
    </header>

    <main>
        <div class="card-login">
            <h2>Login</h2>
            <form method="get" action="dashboard.html">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Enter" required> <br><br>

                <label for="senha">Senha</label>

                <input type="password" id="senha" name="senha" placeholder="Enter" required><br>

                <input class="botao-login" type="submit" value="Login">
            </form>

            <a class="criar-conta" href="cadastro.html">
                Criar conta
            </a>

            <a class="criar-conta" href="redefinirsenha.html">
                Esqueci minha senha
            </a>
        </div>
    </main>
    <script src="assets/js/main.js"></script>
</body>
</html>
