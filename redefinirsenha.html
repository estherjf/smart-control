<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/redefinirsenha.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <title>Redefinir Senha - Smart Control</title>
</head>
<body>
    <header class="cabecalho">
        <img class="logo" src="assets/images/lampada.png" alt="Logo Smart Control">
        <h1>Redefinir senha</h1>
       <a class="menu" href="#">
            <img src="assets/images/menu.png" alt="Menu">
        </a>
    </header>

    <main>
        <div class="card-login">
            <h2>Redefinir senha</h2>
            <form action="index.html" method="get">
                <label for="email">Email</label>
                <input type="email" id="email" name="Email" placeholder="Enter" required><br><br>

                <label for="codigo">Código de verificação</label>
                <input type="text" id="codigo" name="Código" placeholder="Enter" required><br><br>

                <label for="nova-senha">Nova senha</label>
                <input type="password" id="nova-senha" name="Nova senha" minlength="8" placeholder="Enter" required><br><br>

                <label for="confirmar-senha">Confirmar nova senha</label>
                <input type="password" id="confirmar-senha" name="Confirmar senha" minlength="8" placeholder="Enter" required><br><br>

                <input class="botao-login" type="submit" value="Redefinir senha">
            </form>

            <a class="criar-conta" href="index.html">Voltar ao login</a>
        </div>
    </main>
    <script src="assets/js/main.js"></script>
</body>
</html>
